<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         html,body{
    width: 50%;
    margin: 0 auto;
    font-family: Arial, Helvetica, sans-serifs;
 }
        .container{
            width: 360px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #inputField{
            width: 300px;
            height: 46px;
            border: 1px solid black;
            outline: none;
            font-size: 25px;
            vertical-align: middle;
        }
        #addToDo{
            position: absolute;
            right: 4px;
        }
        #addToDo{
            width: 50px;
            height: 50px;
            border: 1px solid black;
            vertical-align: middle;
            font-size: 30px;
        }
        .to_dos{
            margin-top: 25px;
        }
        .paragraph-styling{
            margin: 0;
            cursor:pointer;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>This is my to do List</h1>
    <div class="container">
        <input type="text" id="inputField" placeholder="Write text...">
        <button id="addToDo">+</button>
        <div class="to_dos" id="toDoContainer"></div>
    </div>
        <script>
            let toDoContainer = document.getElementById('toDoContainer');
            let inputField = document.getElementById('inputField');
            let addToDoButtton = document.getElementById('addToDo');

            addToDoButtton.addEventListener('click',function(){
                let paragraph = document.createElement('p');
                paragraph.classList.add('paragraph-styling');
                paragraph.innerText = inputField.value;
                toDoContainer.appendChild(paragraph)
                inputField.value = "";
            });
        </script>
</body>
</html>
