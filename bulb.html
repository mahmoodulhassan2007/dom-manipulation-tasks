<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Light Bulb Control</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f4f4f9;
}

.container {
  text-align: center;
}

#bulb {
  width: 150px;
  margin-bottom: 20px;
}

.button-group button {
  padding: 10px 20px;
  font-size: 16px;
  margin: 5px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  transition: background-color 0.2s;
}

#btnOn {
  background-color: #4CAF50;
  color: white;
}

#btnOn:hover {
  background-color: #45a049;
}

#btnOff {
  background-color: #f44336;
  color: white;
}

#btnOff:hover {
  background-color: #da190b;
}
  </style>
</head>
<body>

  <div class="container">
    <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Light Bulb">

    <div class="button-group">
      <button id="btnOn">Turn ON</button>
      <button id="btnOff">Turn OFF</button>
    </div>
  </div>

  <script>
const bulb = document.getElementById('bulb');
const btnOn = document.getElementById('btnOn');
const btnOff = document.getElementById('btnOff');

const bulbOnUrl = "https://www.w3schools.com/js/pic_bulbon.gif";
const bulbOffUrl = "https://www.w3schools.com/js/pic_bulboff.gif";

btnOn.addEventListener('click', () => {
  bulb.src = bulbOnUrl;
});

btnOff.addEventListener('click', () => {
  bulb.src = bulbOffUrl;
});
  </script>
</body>
</html>
