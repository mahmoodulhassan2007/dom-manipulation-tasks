<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Colors</title>
  <style>
    .btn {
      padding: 7px 7px;
      font-size: 20px;
      margin: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #e0e0e0;
      color: #333;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .btn-1.active { background-color: yellow; color: white; } 
    .btn-2.active { background-color: black; color: white; } 
    .btn-3.active { background-color: orangered; color: white; }
  </style>
</head>
<body>

  <button class="btn btn-1">Button 1</button>
  <button class="btn btn-2">Button 2</button>
  <button class="btn btn-3">Button 3</button>

  <script>
    const buttons = document.querySelectorAll('.btn');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        button.classList.toggle('active');
      });
    });
  </script>

</body>
</html>
