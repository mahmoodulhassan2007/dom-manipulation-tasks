<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student multiple ToDo List</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    input {
        margin: 5px;
        padding: 5px;
        font-size: 2rem;
        width: 400px;
        height: 40px;
        cursor: pointer;
    }
    button {
        padding: 6px 12px;
        margin: 5px;
        width: 150px;
        height: 50px;
        background-color: cadetblue;
        cursor: pointer;
        border-radius: 5px;
        margin-left: 500px;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
        
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #f4f4f4;
        text-align: center;
    }
    .container{
    flex-wrap: wrap;    
    display: grid;
    grid-template-columns: repeat(2,1fr);
    justify-content: center;
    align-items:center;
    margin-top: 50px;
    padding: 12px 12px 12px 12px;
    gap: 20px;
    position: relative;
    }
</style>
</head>
<body>


 <div class="container">
    <input type="text" id="name" placeholder="Name">
<input type="email" id="email" placeholder="Email">
<input type="number" id="age" placeholder="Age" min="1">
<input type="text" id="className" placeholder="Class">
<button onclick="addStudent()">Add Student</button>
 </div>


<table id="studentTable">
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Class</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    let students = [];

    function addStudent() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const age = document.getElementById('age').value.trim();
        const className = document.getElementById('className').value.trim();

        if (!name || !email || !age || !className) {
            alert("Please failed all fields.");
            return;
        }
        if (isNaN(age) || age <= 0) {
            alert("Please enter a valid age.");
            return;
        }

        const student = { name, email, age: parseInt(age), className };
        students.push(student);

        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('age').value = '';
        document.getElementById('className').value = '';

        renderTable();
    }

    function deleteStudent(index) {
        students.splice(index, 1);
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector('#studentTable tbody');
        tbody.innerHTML = ''; 

        students.forEach((student, index) => {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td>${student.age}</td>
                <td>${student.className}</td>
                <td><button onclick="deleteStudent(${index})">Delete</button></td>
            `;

            tbody.appendChild(row);
        });
    }
</script>

</body>
</html>
